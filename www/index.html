<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1720">
<title>Llavero AR</title>
<style>
  /* Cámara a pantalla completa; ajustes en un panel lateral */
  @font-face { font-family: "Fredoka"; font-weight: 600; font-display: swap; src: url("fuentes/fredoka-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Nunito Sans"; font-weight: 400; font-display: swap; src: url("fuentes/nunito-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Nunito Sans"; font-weight: 600; font-display: swap; src: url("fuentes/nunito-sans-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Nunito Sans"; font-weight: 700; font-display: swap; src: url("fuentes/nunito-sans-latin-700-normal.woff2") format("woff2"); }

  :root {
    --tinta: #0f1720;
    --tinta-2: #17222d;
    --tinta-3: #223140;
    --tinta-90: rgba(15, 23, 32, 0.92);
    --tinta-60: rgba(15, 23, 32, 0.6);
    --papel: #f8f3e8;
    --papel-70: rgba(248, 243, 232, 0.7);
    --papel-40: rgba(248, 243, 232, 0.4);
    --lila: #c766ff;
    --marca: #a100ff;
    --rosa: #ff5c8a;
    --fuente-titulo: "Fredoka", "Nunito Sans", system-ui, sans-serif;
    --fuente-texto: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --sup: env(safe-area-inset-top, 0px);
    --inf: env(safe-area-inset-bottom, 0px);
    --izq: env(safe-area-inset-left, 0px);
    --der: env(safe-area-inset-right, 0px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: var(--papel);
    font-family: var(--fuente-texto); font-size: 16px;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  button, input { font: inherit; color: inherit; }

  #escena { position: fixed; inset: 0; overflow: hidden; background: #000; }
  #marco-deteccion {
    position: fixed; z-index: 5; pointer-events: none;
    border: 2px dashed var(--lila); border-radius: 12px;
  }

  /* Guía de escaneo */
  #guia { position: fixed; inset: 0; z-index: 6; pointer-events: none; display: grid; place-items: center; transition: opacity 0.35s ease; }
  #guia.oculta { opacity: 0; }
  .visor {
    width: min(64vw, 320px); aspect-ratio: 3 / 4; max-width: 100%;
    border-radius: 36px; border: 3px dashed rgba(248, 243, 232, 0.85);
    box-shadow: 0 0 0 100vmax rgba(15, 23, 32, 0.32);
    animation: respirar 2.2s ease-in-out infinite;
  }
  @keyframes respirar { 50% { transform: scale(1.04); border-color: var(--lila); } }

  /* Botones flotantes */
  .redondo {
    width: 52px; height: 52px; flex: none;
    border: 0; border-radius: 50%;
    background: var(--tinta-60); color: var(--papel);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
  }
  .redondo svg { width: 24px; height: 24px; }
  .redondo:focus-visible, .boton:focus-visible { outline: 3px solid var(--lila); outline-offset: 2px; }
  .redondo.activo { background: var(--marca); }

  #cabecera {
    position: fixed; z-index: 15; left: 0; right: 0; top: 0;
    display: flex; align-items: center; gap: 10px;
    padding: calc(12px + var(--sup)) max(14px, var(--der)) 12px max(14px, var(--izq));
    background: linear-gradient(to bottom, var(--tinta-60), transparent);
  }
  #cabecera img { width: 34px; height: 34px; border-radius: 9px; }
  #cabecera strong { font-family: var(--fuente-titulo); font-weight: 600; font-size: 19px; flex: 1; }

  #barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    display: flex; align-items: center; gap: 12px;
    padding: 16px max(16px, var(--der)) calc(16px + var(--inf)) max(16px, var(--izq));
    background: linear-gradient(to top, var(--tinta-90), transparent);
  }
  #estado {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-radius: 999px;
    background: var(--tinta-60); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-weight: 600; font-size: 15px;
  }
  #estado .punto { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--papel-70); animation: parpadeo 1.2s ease-in-out infinite; }
  #estado.detectado .punto { background: var(--lila); animation: none; box-shadow: 0 0 0 4px rgba(199, 102, 255, 0.35); }
  @keyframes parpadeo { 50% { opacity: 0.3; } }
  #estado-texto { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Panel de ajustes */
  #velo { position: fixed; inset: 0; z-index: 29; background: rgba(0, 0, 0, 0.45); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
  #velo.visible { opacity: 1; pointer-events: auto; }
  #ajustes {
    position: fixed; z-index: 30; top: 0; right: 0; bottom: 0;
    width: min(86vw, 360px);
    padding: calc(18px + var(--sup)) max(18px, var(--der)) calc(18px + var(--inf)) 18px;
    background: var(--tinta-90);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-left: 1px solid var(--tinta-3);
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
    transform: translateX(105%); transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #ajustes.abierto { transform: none; }
  .ajustes-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ajustes-cabecera h2 { margin: 0; font-family: var(--fuente-titulo); font-weight: 600; font-size: 24px; }
  .ajustes-cabecera .redondo { width: 44px; height: 44px; background: var(--tinta-3); }

  .grupo { display: grid; gap: 4px; }
  .grupo-titulo { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lila); margin-bottom: 4px; }
  .fila-ajuste {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    min-height: 52px; padding: 8px 0; border-bottom: 1px solid var(--tinta-3);
  }
  .fila-ajuste:last-child { border-bottom: 0; }
  .fila-ajuste > span { display: grid; gap: 2px; min-width: 0; }
  .fila-ajuste small { color: var(--papel-70); font-size: 13px; line-height: 1.35; }
  .fila-ajuste.columna { flex-direction: column; align-items: stretch; gap: 8px; }
  .fila-ajuste.columna > span { display: flex; justify-content: space-between; }
  .fila-ajuste output { color: var(--papel-70); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--lila); }

  .interruptor { position: relative; width: 50px; height: 30px; flex: none; }
  .interruptor input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .interruptor i { position: absolute; inset: 0; border-radius: 999px; background: var(--tinta-3); transition: background 0.2s ease; }
  .interruptor i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--papel); transition: transform 0.2s ease; }
  .interruptor input:checked + i { background: var(--marca); }
  .interruptor input:checked + i::after { transform: translateX(20px); }
  .interruptor input:focus-visible + i { outline: 3px solid var(--lila); outline-offset: 2px; }
  .interruptor input:disabled + i { opacity: 0.4; }

  .boton {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 50px; padding: 0 18px;
    border: 0; border-radius: 14px;
    background: var(--marca); color: #fff;
    font-family: var(--fuente-titulo); font-weight: 600; font-size: 17px;
    cursor: pointer; touch-action: manipulation;
  }
  .boton.secundario { background: var(--tinta-3); color: var(--papel); }
  .boton:active { transform: scale(0.98); }
  .nota { margin: 0; font-size: 13px; line-height: 1.45; color: var(--papel-70); }

  /* Calibración */
  #calibrar-capa { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: grid; place-items: center; }
  #calibrar-capa .mira {
    width: 34vmin; height: 34vmin; border-radius: 50%;
    border: 3px solid var(--lila); box-shadow: 0 0 0 100vmax rgba(15, 23, 32, 0.45);
  }
  #calibrar-barra {
    position: fixed; z-index: 21; left: 0; right: 0; bottom: 0;
    display: grid; gap: 10px;
    padding: 18px max(16px, var(--der)) calc(18px + var(--inf)) max(16px, var(--izq));
    background: var(--tinta-90);
  }
  #calibrar-barra p { margin: 0; text-align: center; line-height: 1.4; }
  #calibrar-barra .fila { display: flex; gap: 10px; }
  #calibrar-barra .fila > * { flex: 1; }

  #toque-sonido {
    position: fixed; z-index: 16; left: 50%; transform: translateX(-50%);
    bottom: calc(96px + var(--inf));
    padding: 10px 16px; border-radius: 999px; border: 0;
    background: var(--papel); color: var(--tinta); font-weight: 700;
  }
  #aviso {
    position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
    top: calc(80px + var(--sup)); width: min(92vw, 460px);
    padding: 14px 18px; border-radius: 16px;
    background: var(--papel); color: var(--tinta); font-weight: 600; line-height: 1.4;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
  }

  @media (prefers-reduced-motion: reduce) {
    .visor, #estado .punto { animation: none; }
    #ajustes, #velo { transition: none; }
  }
</style>
</head>
<body>

<div id="escena"></div>
<div id="marco-deteccion" hidden></div>
<div id="guia"><div class="visor"></div></div>

<header id="cabecera">
  <img src="icono.svg" alt="">
  <strong id="titulo">Llavero AR</strong>
  <button class="redondo" id="abrir-ajustes" type="button" aria-label="Abrir ajustes" aria-controls="ajustes" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path>
      <circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle>
    </svg>
  </button>
</header>

<div id="barra">
  <div id="estado" role="status" aria-live="polite"><span class="punto"></span><span id="estado-texto">Abriendo la cámara…</span></div>
  <button class="redondo" id="silenciar" type="button" aria-label="Silenciar música">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
      <path id="icono-ondas" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path>
      <path id="icono-mudo" d="M22 9l-6 6M16 9l6 6" style="display:none"></path>
    </svg>
  </button>
</div>

<button id="toque-sonido" type="button" hidden>Toca para activar el sonido</button>

<!-- Calibración de color -->
<div id="calibrar-capa" hidden><div class="mira"></div></div>
<div id="calibrar-barra" hidden>
  <p>Pon el llavero dentro del círculo, de cerca y con buena luz.</p>
  <div class="fila">
    <button class="boton secundario" id="calibrar-cancelar" type="button">Cancelar</button>
    <button class="boton" id="calibrar-capturar" type="button">Calibrar</button>
  </div>
</div>

<!-- Panel de ajustes -->
<div id="velo"></div>
<aside id="ajustes" aria-label="Ajustes" aria-hidden="true">
  <div class="ajustes-cabecera">
    <h2>Ajustes</h2>
    <button class="redondo" id="cerrar-ajustes" type="button" aria-label="Cerrar ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <section class="grupo">
    <div class="grupo-titulo">Música</div>
    <label class="fila-ajuste" for="aj-musica">
      <span>Reproducir música<small>Suena al detectar el llavero</small></span>
      <span class="interruptor"><input type="checkbox" id="aj-musica" checked><i></i></span>
    </label>
    <div class="fila-ajuste columna">
      <span><label for="aj-volumen">Volumen</label><output id="aj-volumen-val">90%</output></span>
      <input type="range" id="aj-volumen" min="0" max="100" step="5" value="90">
    </div>
  </section>

  <section class="grupo">
    <div class="grupo-titulo">Animación</div>
    <div class="fila-ajuste columna">
      <span><label for="aj-tamano">Tamaño del corazón</label><output id="aj-tamano-val">100%</output></span>
      <input type="range" id="aj-tamano" min="40" max="200" step="10" value="100">
    </div>
    <label class="fila-ajuste" for="aj-notas">
      <span>Notas musicales</span>
      <span class="interruptor"><input type="checkbox" id="aj-notas" checked><i></i></span>
    </label>
  </section>

  <section class="grupo">
    <div class="grupo-titulo">Cámara</div>
    <label class="fila-ajuste" for="aj-linterna">
      <span>Linterna<small id="aj-linterna-nota">Útil con poca luz</small></span>
      <span class="interruptor"><input type="checkbox" id="aj-linterna"><i></i></span>
    </label>
  </section>

  <section class="grupo">
    <div class="grupo-titulo">Reconocimiento</div>
    <label class="fila-ajuste" for="aj-imagen">
      <span>Por imagen<small>Preciso; necesita ver el llavero parecido a las fotos</small></span>
      <span class="interruptor"><input type="checkbox" id="aj-imagen" checked><i></i></span>
    </label>
    <label class="fila-ajuste" for="aj-color">
      <span>Por color y forma<small>Funciona desde cualquier ángulo</small></span>
      <span class="interruptor"><input type="checkbox" id="aj-color" checked><i></i></span>
    </label>
    <div class="fila-ajuste columna">
      <span><label for="aj-sensibilidad">Sensibilidad del color</label><output id="aj-sensibilidad-val">Media</output></span>
      <input type="range" id="aj-sensibilidad" min="1" max="5" step="1" value="3">
    </div>
    <label class="fila-ajuste" for="aj-marco">
      <span>Ver zona detectada<small>Muestra un recuadro donde se detecta el color</small></span>
      <span class="interruptor"><input type="checkbox" id="aj-marco"><i></i></span>
    </label>
    <div class="fila-ajuste columna">
      <button class="boton" id="abrir-calibrar" type="button">Calibrar color del llavero</button>
      <p class="nota" id="nota-calibracion">Usando el color del cocodrilo de las fotos.</p>
    </div>
  </section>

  <button class="boton secundario" id="restablecer" type="button">Restablecer ajustes</button>
</aside>

<div id="aviso" role="alert" hidden></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
