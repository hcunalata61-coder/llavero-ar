name: Compilar APK

# Se ejecuta cada vez que subes cambios, o a mano desde la pestaña "Actions"
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Componentes de Android
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Instalar dependencias
        run: npm ci

      - name: Crear proyecto Android (cámara, ícono y pantalla de carga)
        run: |
          npx cap add android
          node scripts/preparar-android.mjs
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LlaveroAR.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LlaveroAR-apk
          path: LlaveroAR.apk

      - name: Publicar APK para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Llavero AR · prueba ${{ github.run_number }}
          body: Descarga **LlaveroAR.apk** desde el celular e instálala.
          files: LlaveroAR.apk
          make_latest: true
